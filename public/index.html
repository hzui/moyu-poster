<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>摸鱼日历海报</title>
<style>
  body { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #fdf6e3; color: #6b4a1f; text-align: center; margin: 0; padding: 32px 16px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: #a08050; }
  .row { margin: 16px 0; }
  input, button { font-size: 16px; padding: 8px 12px; border-radius: 8px; border: 1px solid #e0cfa8; }
  button { background: #e8930c; color: #fff; border: none; cursor: pointer; }
  img#poster { max-width: 420px; width: 100%; border-radius: 12px; box-shadow: 0 8px 30px rgba(150,100,20,.2); margin-top: 12px; }
  a { color: #e8930c; }
</style>
</head>
<body>
  <h1>🐟 摸鱼日历海报</h1>
  <p>每天自动生成 · <a href="/api/poster">今日海报直链 PNG</a>（首次打开需等待数秒渲染）</p>
  <div class="row">
    <input type="date" id="d">
    <button id="go">查看指定日期</button>
  </div>
  <img id="poster" src="/api/poster" alt="今日摸鱼海报">
  <script>
    document.getElementById('go').onclick = function () {
      var d = document.getElementById('d').value;
      document.getElementById('poster').src = d ? '/api/poster?date=' + d : '/api/poster';
    };
  </script>
</body>
</html>
